version: '3.8'

services:
  backend:
    build: .
    container_name: innovatech-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    volumes:
      - backend-logs:/app/logs
    networks:
      - innovatech-net

volumes:
  backend-logs:
    driver: local

networks:
  innovatech-net:
    driver: bridge